name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cinedata.back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build
      - run: dotnet test --no-build

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cinedata.front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cinedata.front/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false
