<!doctype html>
<!--

  Para regenerar: abra num Chrome com a janela em 1200×630 e fotografe, ou use o playwright-core do front
  (page.setViewportSize({ width: 1200, height: 630 }); page.screenshot()).
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CineData · imagem de compartilhamento</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; }
    body { width: 1200px; height: 630px; background: #0d0e12; color: #f3efe6; font-family: Inter, sans-serif; position: relative; overflow: hidden; }
    .feixe { position: absolute; inset: 0; background: linear-gradient(98deg, rgba(255, 181, 71, .30), transparent 78%); clip-path: polygon(0 44%, 100% -6%, 100% 106%, 0 56%); opacity: .55; }
    .conteudo { position: absolute; inset: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 22px; font-family: "Bricolage Grotesque", sans-serif; font-size: 64px; letter-spacing: -0.03em; }
    .logo svg { width: 88px; height: 88px; }
    .logo b { font-weight: 800; }
    h1 { margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-size: 76px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; max-width: 15ch; }
    p { margin: 0; display: flex; justify-content: space-between; gap: 24px; white-space: nowrap; font-size: 22px; color: #a3a7b3; }
    p strong { color: #ffb547; font-weight: 600; }
  </style>
</head>
<body>
  <div class="feixe"></div>
  <div class="conteudo">
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="f" x1="9.5" y1="0" x2="29" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFB547" stop-opacity=".55"/><stop offset="1" stop-color="#FFB547" stop-opacity=".07"/></linearGradient></defs><polygon points="9.5,14.6 29,6.5 29,25.5 9.5,17.4" fill="url(#f)"/><rect x="3" y="12.5" width="6.5" height="7" rx="1.4" fill="#F3EFE6"/><rect x="15.5" y="18" width="2.6" height="5" rx=".8" fill="#F3EFE6"/><rect x="20" y="14.5" width="2.6" height="8.5" rx=".8" fill="#F3EFE6"/><rect x="24.5" y="10" width="2.6" height="13" rx=".8" fill="#FFB547"/></svg>
      <span>cine<b>data</b></span>
    </div>
    <h1>O cinema brasileiro em números</h1>
    <p><strong>Top 10 da semana, mapa por estado e a curva de cada filme</strong><span>Fonte: ANCINE (dados abertos)</span></p>
  </div>

</html>
